name: Update Community latest update date

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'communities/*/metadata/**'
      - '!communities/all/**'

# Only one run at a time, as each run commits to main
concurrency:
  group: "community-last-update"
  cancel-in-progress: false

jobs:
  update-last-update-date:
    runs-on: ubuntu-latest
    name: Extract last curation date for each community
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          # full history is needed to find the last commit of each community
          fetch-depth: 0
      - name: Extract last curation date
        run: |
          bash sources/bin/extract_last_update.sh
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update community latest update date"
          file_pattern: communities/all/metadata/community_last_update.tsv
          branch: main
          commit_user_name: GitHub Actions
          commit_user_email: actions@github.com
          commit_author: GitHub Actions <actions@github.com>
          repository_initial_branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACTIONS_PAT }}
