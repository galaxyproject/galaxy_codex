id: tools
title: Community curated tools
tabs:
- id: no_associated_edam_operation
  title: No associated EDAM operation
  heading_md: 'Top 10 most used tools* for the EDAM operation: No associated EDAM
    operation <br> *based on usage statistics from Galaxy’s main servers over the
    last five years'
  content:
  - title_md: rgrnastar
    description_md: |-
      RNA STAR is an ultra fast universal RNA and scRNA-seq aligner and mapper
       (Tool usage: 1143514)
      <ul>
        <li><a href="{{ galaxy_base_url }}/?tool_id=rna_star">rna_star</a></li>
        <li><a href="{{ galaxy_base_url }}/?tool_id=rna_starsolo">rna_starsolo</a></li>
      </ul>
  - title_md: deseq2
    description_md: |-
      Differential gene expression analysis based on the negative binomial distribution
       (Tool usage: 449489)
      <ul>
        <li><a href="{{ galaxy_base_url }}/?tool_id=deseq2">deseq2</a></li>
      </ul>
  - title_md: scanpy
    description_md: |-
      Scanpy – Single-Cell Analysis in Python
       (Tool usage: 142968)
      <ul>
        <li><a href="{{ galaxy_base_url }}/?tool_id=scanpy_cluster_reduce_dimension">scanpy_cluster_reduce_dimension</a></li>
        <li><a href="{{ galaxy_base_url }}/?tool_id=scanpy_filter">scanpy_filter</a></li>
        <li><a href="{{ galaxy_base_url }}/?tool_id=scanpy_inspect">scanpy_inspect</a></li>
        <li><a href="{{ galaxy_base_url }}/?tool_id=scanpy_normalize">scanpy_normalize</a></li>
        <li><a href="{{ galaxy_base_url }}/?tool_id=scanpy_plot">scanpy_plot</a></li>
        <li><a href="{{ galaxy_base_url }}/?tool_id=scanpy_remove_confounders">scanpy_remove_confounders</a></li>
      </ul>
  - title_md: volcanoplot
    description_md: |-
      Tool to create a Volcano Plot
       (Tool usage: 126750)
      <ul>
        <li><a href="{{ galaxy_base_url }}/?tool_id=volcanoplot">volcanoplot</a></li>
      </ul>
  - title_md: edger
    description_md: |-
      Perform RNA-Seq differential expression analysis using edgeR pipeline
       (Tool usage: 100892)
      <ul>
        <li><a href="{{ galaxy_base_url }}/?tool_id=edger">edger</a></li>
      </ul>
  - title_md: anndata
    description_md: |-
      Import, Export, Inspect and Manipulate Anndata and Loom objects
       (Tool usage: 87208)
      <ul>
        <li><a href="{{ galaxy_base_url }}/?tool_id=anndata_export">anndata_export</a></li>
        <li><a href="{{ galaxy_base_url }}/?tool_id=anndata_import">anndata_import</a></li>
        <li><a href="{{ galaxy_base_url }}/?tool_id=anndata_inspect">anndata_inspect</a></li>
        <li><a href="{{ galaxy_base_url }}/?tool_id=anndata_manipulate">anndata_manipulate</a></li>
        <li><a href="{{ galaxy_base_url }}/?tool_id=modify_loom">modify_loom</a></li>
      </ul>
  - title_md: deg_annotate
    description_md: |-
      Annotate DESeq2/DEXSeq output tables
       (Tool usage: 79388)
      <ul>
        <li><a href="{{ galaxy_base_url }}/?tool_id=deg_annotate">deg_annotate</a></li>
      </ul>
  - title_md: dexseq
    description_md: |-
      Inference of differential exon usage in RNA-Seq
       (Tool usage: 54339)
      <ul>
        <li><a href="{{ galaxy_base_url }}/?tool_id=dexseq">dexseq</a></li>
        <li><a href="{{ galaxy_base_url }}/?tool_id=dexseq_count">dexseq_count</a></li>
        <li><a href="{{ galaxy_base_url }}/?tool_id=plotdexseq">plotdexseq</a></li>
      </ul>
  - title_md: fgsea
    description_md: |-
      Perform gene set testing using fgsea
       (Tool usage: 34998)
      <ul>
        <li><a href="{{ galaxy_base_url }}/?tool_id=fgsea">fgsea</a></li>
      </ul>
  - title_md: dropletutils
    description_md: |-
      DropletUtils - Utilities for handling droplet-based single-cell RNA-seq data
       (Tool usage: 12547)
      <ul>
        <li><a href="{{ galaxy_base_url }}/?tool_id=dropletutils">dropletutils</a></li>
      </ul>
