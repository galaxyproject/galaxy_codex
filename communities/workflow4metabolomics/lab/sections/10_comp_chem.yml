id: comp_chem
title: Computational chemistry
tabs:
- id: overview
  title: Overview
  heading_md: >
    In silico tools for molecular structure optimisation and mass spectra
    prediction.
- id: tools
  title: Tools
  heading_md: ''
  content:
    subsections:
    - id: structure_optimization
      title: Structure optimization
      content:
      - title_md: xtb_molecular_optimization
        description_md: |-
          Performs semiempirical molecular optimization.
           (Tool usage: 2950)
          <ul>
            <li><a href="{{ galaxy_base_url }}/?tool_id=xtb_molecular_optimization">xtb_molecular_optimization</a></li>
          </ul>
    - id: spectrum_prediction
      title: Spectrum prediction
      content:
      - title_md: QCxMS
        description_md: |-
          QCxMS is a quantum chemical (QC) based program that enables users to calculate mass spectra (MS) using Born-Oppenheimer Molecular Dynamics (MD).
           (Tool usage: 46380)
          <ul>
            <li><a href="{{ galaxy_base_url }}/?tool_id=qcxms_getres">qcxms_getres</a></li>
            <li><a href="{{ galaxy_base_url }}/?tool_id=qcxms_neutral_run">qcxms_neutral_run</a></li>
            <li><a href="{{ galaxy_base_url }}/?tool_id=qcxms_production_run">qcxms_production_run</a></li>
          </ul>
    - id: metabolism_prediction
      title: Metabolism prediction
      content:
      - title_md: biotransformer
        description_md: |-
          BioTransformer is a tool for prediction of small molecule metabolism in mammals.
           (Tool usage: 95)
          <ul>
            <li><a href="{{ galaxy_base_url }}/?tool_id=biotransformer">biotransformer</a></li>
          </ul>
    - id: rt_prediction
      title: Rt prediction
      content:
      - title_md: retip
        description_md: |-
          nan
           (Tool usage: 0)
          <ul>
            <li><a href="{{ galaxy_base_url }}/?tool_id=retip_apply">retip_apply</a></li>
            <li><a href="{{ galaxy_base_url }}/?tool_id=retip_descriptors">retip_descriptors</a></li>
            <li><a href="{{ galaxy_base_url }}/?tool_id=retip_filter_rt">retip_filter_rt</a></li>
            <li><a href="{{ galaxy_base_url }}/?tool_id=retip_train">retip_train</a></li>
          </ul>
    - id: compound_processing
      title: Compound processing
      content:
      - title_md: isolib
        description_md: |-
          Create an isotopic pattern library for given compounds and adducts.
           (Tool usage: 225)
          <ul>
            <li><a href="{{ galaxy_base_url }}/?tool_id=isolib">isolib</a></li>
          </ul>
      - title_md: gc_derivatization
        description_md: |-
          In silico derivatization for GC.
           (Tool usage: 51)
          <ul>
            <li><a href="{{ galaxy_base_url }}/?tool_id=gc_derivatization">gc_derivatization</a></li>
          </ul>
      - title_md: filter_compounds
        description_md: |-
          Tool for filtering organometallics/anorganic compounds from a list of compounds.
           (Tool usage: 0)
          <ul>
            <li><a href="{{ galaxy_base_url }}/?tool_id=filter_orgmet_anorg">filter_orgmet_anorg</a></li>
          </ul>
      - title_md: rem_complex
        description_md: |-
          Removes molecular coordination complexes.
           (Tool usage: 212)
          <ul>
            <li><a href="{{ galaxy_base_url }}/?tool_id=rem_complex">rem_complex</a></li>
          </ul>
