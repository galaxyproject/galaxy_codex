# Example section demonstrating two levels of navigation within a section:
#   section -> tabs (LC-MS, GC-MS, ... -> subsections (Overview, Tools, ...)
# Each tab's `content` is replaced entirely by a `subsections` mapping.
# Subsections CANNOT be nested further, and cannot be mixed with plain items.

id: data_analysis
title: Data analysis (example)
tabs:

- id: lcms
  title: LC-MS
  heading_md: Data analysis for LC-MS-based metabolomics
  content:
    subsections:
      - id: lcms_overview
        title: Overview
        content:
          - title_md: About LC-MS analysis
            description_md: >
              Placeholder overview text for LC-MS data analysis in Galaxy.
      - id: lcms_tools
        title: Tools
        content:
          - title_md: XCMS
            description_md: Feature detection and alignment with the XCMS R package.
            buttons:
              - link: "{{ galaxy_base_url }}/?tool_id=xcms"
                tip: Open XCMS
                icon: run
          - title_md: CAMERA
            description_md: Annotation of isotope patterns, adducts and fragments.
            buttons:
              - link: "{{ galaxy_base_url }}/?tool_id=camera"
                tip: Open CAMERA
                icon: run
      - id: lcms_workflows
        title: Workflows
        content:
          - title_md: "Mass spectrometry: LC-MS data processing"
            description_md: >
              XCMS-based preprocessing combined with CAMERA annotation.
            buttons:
              - link: "{{ galaxy_base_url }}/workflows/trs_import?trs_server=workflowhub.eu&run_form=true&trs_id=677"
                label_md: Import workflow
                icon: run
      - id: lcms_tutorials
        title: Tutorials
        content:
          - title_md: "Mass spectrometry: LC-MS preprocessing with XCMS"
            description_md: >
              Data import, quality control, and feature detection.
            buttons:
              - link: https://training.galaxyproject.org/training-material/topics/metabolomics/tutorials/lcms-preprocessing/tutorial.html
                tip: View tutorial
                icon: tutorial

