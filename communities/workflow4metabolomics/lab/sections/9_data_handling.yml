      content:
      - title_md: bioconductor_mzr
        description_md: |-
          Galaxy wrapper for the Bioconductor mzR package, enabling conversion between common mass spectrometry data formats (mzML, mzXML, netCDF) within Galaxy workflows.
           (Tool usage: 0)
          <ul>
            <li><a href="{{ galaxy_base_url }}/?tool_id=bioconductor_mzr_convert">bioconductor_mzr_convert</a></li>
          </ul>
      - title_md: mzml_validator
        description_md: |-
          mzML Validator checks if mzML file validates against XML Schema Definition of HUPO Proteomics Standard Initiative.
           (Tool usage: 0)
          <ul>
            <li><a href="{{ galaxy_base_url }}/?tool_id=mzml_validator">mzml_validator</a></li>
          </ul>
