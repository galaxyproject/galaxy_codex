          Tools for handling mzTab-M files using various packages.
           (Tool usage: 0)
          <ul>
            <li><a href="{{ galaxy_base_url }}/?tool_id=mztabm_validate">mztabm_validate</a></li>
          </ul>
      - title_md: mzspeclib
        description_md: |-
          mzspeclib is a library and set of tools for handling, converting, and validating mass spectral libraries in a standardized format. This suite provides Galaxy wrappers for mzspeclib's core functionalities, including conversion and validation of spectral libraries.
           (Tool usage: 0)
          <ul>
            <li><a href="{{ galaxy_base_url }}/?tool_id=mzspeclib_convert">mzspeclib_convert</a></li>
